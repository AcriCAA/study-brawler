<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Brawler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 900px;
            height: 650px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
        }

        #game-container canvas {
            border-radius: 12px;
        }

        canvas {
            display: block;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #loading-screen h1 {
            color: #00ffff;
            font-size: 48px;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 30px;
        }

        .loading-bar-container {
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .loading-text {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen">
            <h1>STUDY BRAWLER</h1>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loading-bar"></div>
            </div>
            <p class="loading-text">Loading game assets...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="/game/js/config.js?v=20260207"></script>
    <script src="/game/js/scenes/LoginCheckScene.js?v=20260207"></script>
    <script src="/game/js/scenes/LoginScene.js?v=20260207"></script>
    <script src="/game/js/scenes/BootScene.js?v=20260207"></script>
    <script src="/game/js/scenes/CharacterSelectScene.js?v=20260207"></script>
    <script src="/game/js/scenes/MenuScene.js?v=20260207"></script>
    <script src="/game/js/scenes/LevelSelectScene.js?v=20260207"></script>
    <script src="/game/js/scenes/GameScene.js?v=20260207"></script>
    <script src="/game/js/scenes/ResultScene.js?v=20260207"></script>
    <script src="/game/js/main.js?v=20260207"></script>
</body>
</html>
